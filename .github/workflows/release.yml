name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Essential for changelogs

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          # cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          # This token is auto-generated by GitHub for the current repo
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This is the PAT you manually added to your Repo Secrets
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
